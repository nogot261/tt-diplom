{% extends 'base.html' %}
{% block title %}Вход — портал охраны труда{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card-pro">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="app-brand-mark app-brand-mark-lg mx-auto">ОТ</span>
        <h2 class="mt-3 mb-1">Вход в систему</h2>
        <div class="text-secondary">Введите данные учетной записи</div>
      </div>
      <form method="post" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label class="form-label">Электронная почта</label>
          <input class="form-control form-control-lg" type="email" name="email" required autocomplete="username" placeholder="employee@example.ru">
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password" placeholder="Введите пароль">
        </div>
        <button class="btn btn-success btn-lg w-100" type="submit">Войти</button>
      </form>
      <details class="demo-accounts mt-4">
        <summary>Демонстрационные учетные записи</summary>
        <div class="mt-3 small text-secondary">
          <div><strong>Сотрудник:</strong> employee@example.ru / Employee123!</div>
          <div class="mt-1"><strong>Администратор:</strong> admin@example.ru / Admin123!</div>
        </div>
      </details>
    </div>
  </div>
</div>
{% endblock %}
